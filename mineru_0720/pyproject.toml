[project]
name = "mineru-pdf-converter"
version = "0.1.0"
description = "MinerU PDF → DOCX 转换服务，含 Web 管理界面"
requires-python = ">=3.10"
dependencies = [
    "mineru[pipeline]>=3.2.0",
    "python-docx>=1.0.0",
    "tqdm>=4.60.0",
    "loguru>=0.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
